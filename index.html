<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.5);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 50%);
      opacity: 0.15;
      animation: pulse 4s linear infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-paused {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status-active .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-paused .status-dot {
      background: #f97316;
    }

    .stats-panel {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.5);
    }

    .total-time-card {
      text-align: center;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .total-time-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .total-time-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
    }

    .global-controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-pause {
      background: var(--primary);
      color: white;
    }

    .btn-pause:hover {
      background: #2563eb;
    }

    .btn-resume {
      background: #f97316;
      color: white;
    }

    .btn-resume:hover {
      background: #ea580c;
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .container {
      padding: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 0 0 12px 0;
    }

    #domains {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .domain-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .domain-item:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .domain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .domain-name {
      font-weight: 500;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    
    .domain-name img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .domain-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .domain-time {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
      padding: 3px 6px;
      border-radius: 5px;
    }

    .domain-actions {
      display: flex;
      gap: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 13px;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
    }

    .action-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .action-stop:hover {
      color: var(--warning);
      background: rgba(245, 158, 11, 0.1);
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Excluded List styles */
    .excluded-panel {
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding: 16px;
      background: rgba(15, 23, 42, 0.4);
    }

    .excluded-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .excluded-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.4);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      font-size: 12.5px;
    }

    .excluded-name {
      color: var(--text-muted);
      text-decoration: line-through;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .btn-restore {
      background: none;
      border: none;
      color: var(--success);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 500;
    }

    .btn-restore:hover {
      background: rgba(16, 185, 129, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="header-title">
      <img src="public/tab-summary-icon.png" alt="Logo" style="width: 22px; height: 22px; border-radius: 4px;">
      Time Tracker
    </h1>
    <div id="status-badge" class="status-badge status-active">
      <span class="status-dot"></span>
      <span id="status-text">Active</span>
    </div>
  </div>
  
  <div class="stats-panel">
    <div class="total-time-card">
      <div class="total-time-label">Total Time Tracked</div>
      <div class="total-time-value" id="total-time">00s</div>
    </div>
    
    <div class="global-controls">
      <button id="btn-pause-toggle" class="btn btn-pause">
        <span id="pause-icon">⏸️</span>
        <span id="pause-text">Pause</span>
      </button>
      <button id="btn-clear-all" class="btn btn-clear">
        <span>🗑️</span>
        <span>Clear All</span>
      </button>
    </div>
  </div>

  <div class="container">
    <h2 class="section-title">Tracked Websites</h2>
    <ul id="domains"></ul>
  </div>

  <div id="excluded-section" class="excluded-panel" style="display: none;">
    <h2 class="section-title">Excluded Websites</h2>
    <div id="excluded-list" class="excluded-list"></div>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
