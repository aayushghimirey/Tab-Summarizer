<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: hsl(222, 47%, 7%);
      --surface: rgba(30, 41, 59, 0.45);
      --surface-hover: rgba(30, 41, 59, 0.7);
      --primary: hsl(217, 91%, 60%);
      --primary-glow: rgba(59, 130, 246, 0.35);
      --text: hsl(210, 40%, 98%);
      --text-muted: hsl(215, 20%, 65%);
      --border: rgba(255, 255, 255, 0.08);
      --danger: hsl(346, 84%, 61%);
      --warning: hsl(38, 92%, 50%);
      --success: hsl(142, 70%, 50%);
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }

    body.light-theme {
      --bg: hsl(210, 40%, 96%);
      --surface: #ffffff;
      --surface-hover: hsl(210, 40%, 99%);
      --primary: hsl(221, 83%, 53%);
      --primary-glow: rgba(37, 99, 235, 0.15);
      --text: hsl(222, 47%, 11%);
      --text-muted: hsl(215, 16%, 47%);
      --border: rgba(0, 0, 0, 0.08);
      --danger: hsl(346, 84%, 55%);
      --warning: hsl(38, 92%, 45%);
      --success: hsl(142, 70%, 40%);
      --shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.06), 0 2px 6px -2px rgba(0, 0, 0, 0.04);
    }

    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    
    body.light-theme .header {
      background: linear-gradient(135deg, #ffffff 0%, hsl(210, 40%, 94%) 100%);
    }

    .header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 50%);
      opacity: 0.15;
      animation: pulse 4s linear infinite alternate;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1;
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--text);
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.08) rotate(15deg);
    }
    
    body.light-theme .theme-btn {
      background: rgba(0, 0, 0, 0.04);
    }
    
    body.light-theme .theme-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .status-active {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-paused {
      background: rgba(249, 115, 22, 0.1);
      color: var(--warning);
      border: 1px solid rgba(249, 115, 22, 0.2);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status-active .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-paused .status-dot {
      background: var(--warning);
    }

    .stats-panel {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.25);
    }
    
    body.light-theme .stats-panel {
      background: rgba(255, 255, 255, 0.3);
    }

    .total-time-card {
      text-align: center;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .total-time-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .total-time-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .global-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-pause {
      background: linear-gradient(135deg, var(--primary) 0%, hsl(217, 91%, 50%) 100%);
      color: white;
      box-shadow: 0 4px 10px -2px rgba(59, 130, 246, 0.4);
    }

    .btn-pause:hover {
      background: hsl(217, 91%, 52%);
      transform: translateY(-1px);
    }

    .btn-resume {
      background: linear-gradient(135deg, var(--warning) 0%, hsl(38, 92%, 40%) 100%);
      color: white;
      box-shadow: 0 4px 10px -2px rgba(245, 158, 11, 0.4);
    }

    .btn-resume:hover {
      background: hsl(38, 92%, 43%);
      transform: translateY(-1px);
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.08);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      transform: translateY(-1px);
    }

    .container {
      padding: 18px 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 0 0 14px 0;
    }

    #domains {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .domain-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow);
    }

    .domain-item:hover {
      border-color: rgba(59, 130, 246, 0.45);
      background: var(--surface-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.15);
    }
    
    body.light-theme .domain-item:hover {
      box-shadow: 0 6px 15px -4px rgba(0, 0, 0, 0.05);
    }

    .domain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .domain-name {
      font-weight: 500;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    
    .domain-name img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: transparent;
    }

    .domain-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #domain-title {
      display: inline-block;
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .domain-time {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    body.light-theme .domain-time {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text);
    }

    .domain-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      font-size: 13px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    
    body.light-theme .action-btn {
      background: rgba(0, 0, 0, 0.02);
    }

    .action-btn:hover {
      color: var(--text);
      transform: scale(1.08);
    }

    .action-delete:hover {
      color: white;
      background: var(--danger);
      border-color: var(--danger);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }

    .action-stop:hover {
      color: white;
      background: var(--warning);
      border-color: var(--warning);
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
    }
    
    body.light-theme .progress-track {
      background: rgba(0, 0, 0, 0.05);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, hsl(217, 91%, 50%) 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .empty-state {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.01);
    }

    /* Excluded List styles */
    .excluded-panel {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding: 18px 16px;
      background: rgba(15, 23, 42, 0.2);
    }

    .excluded-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .excluded-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      font-size: 12.5px;
      box-shadow: var(--shadow);
    }

    .excluded-name {
      color: var(--text-muted);
      text-decoration: line-through;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .btn-restore {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success);
      cursor: pointer;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-restore:hover {
      background: var(--success);
      color: white;
      border-color: var(--success);
      transform: translateY(-0.5px);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="header-title">
      <img src="public/tab-summary-icon.png" alt="Logo" style="width: 22px; height: 22px; border-radius: 4px;">
      Time Tracker
    </h1>
    <div class="header-right">
      <button id="btn-theme-toggle" class="theme-btn" title="Toggle Light/Dark Theme">🌙</button>
      <div id="status-badge" class="status-badge status-active">
        <span class="status-dot"></span>
        <span id="status-text">Active</span>
      </div>
    </div>
  </div>
  
  <div class="stats-panel">
    <div class="total-time-card">
      <div class="total-time-label">Total Time Tracked</div>
      <div class="total-time-value" id="total-time">00s</div>
    </div>
    
    <div class="global-controls">
      <button id="btn-pause-toggle" class="btn btn-pause">
        <span id="pause-icon">⏸️</span>
        <span id="pause-text">Pause</span>
      </button>
      <button id="btn-clear-all" class="btn btn-clear">
        <span>🗑️</span>
        <span>Clear All</span>
      </button>
    </div>
  </div>

  <div class="container">
    <h2 class="section-title">Tracked Websites</h2>
    <ul id="domains"></ul>
  </div>

  <div id="excluded-section" class="excluded-panel" style="display: none;">
    <h2 class="section-title">Excluded Websites</h2>
    <div id="excluded-list" class="excluded-list"></div>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
